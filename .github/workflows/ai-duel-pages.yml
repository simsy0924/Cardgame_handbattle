name: Deploy AI duel site

on:
  push:
    branches: [main]
    paths:
      - 'ai-duel/web/**'
      - '.github/workflows/ai-duel-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ai-duel-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-duel/web

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
